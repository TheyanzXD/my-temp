name = "my-temp"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".svelte-kit/cloudflare"

# KV bindings used by the app at runtime.
# Production + preview IDs created 2026-09-14.
[[kv_namespaces]]
binding = "MAILBOX_STORE"
id = "ed8d435120ce4931a364ffed852c6cb4"
preview_id = "9aead75645c94a43a57abf0895632068"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "d0f29c72b09a43e4818d425a46ca1f9e"
preview_id = "4d906e5aec2741aa833f5481ea160a07"

# Default public environment variables (non-secret).
[vars]
MAIL_PROVIDER = "webhook"
CUSTOM_DOMAINS = "yoai.my.id"
APP_NAME = "MyTemp"
APP_URL = "https://yoai.my.id"
MAILBOX_LIFETIME_MINUTES = "60"
MAX_REQUESTS_PER_MINUTE = "120"
CORS_ALLOWED_ORIGINS = "*"
